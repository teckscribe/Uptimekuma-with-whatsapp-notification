x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  uptime-kuma:
    # Pinned to the exact release that wrote the data in uptime-kuma-data/.
    # Do not bump this without a fresh backup: the SQLite schema migrates
    # forward on start and cannot be rolled back.
    #
    # If this tag ever disappears from Docker Hub, load the saved copy:
    #   ./scripts/load-image.sh    (reads images/uptime-kuma-2.0.2.tar.gz)
    image: ${UPTIME_KUMA_IMAGE:-louislam/uptime-kuma:2.0.2}
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma-data:/app/data
    environment:
      - UPTIME_KUMA_PORT=3001
    networks:
      - monitoring-network
    logging: *default-logging

  whatsapp-bot:
    build: ./whatsapp-bot
    container_name: whatsapp-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./whatsapp-bot/config:/app/config
      # WhatsApp session (a linked device). Never copy this to another machine.
      - ./whatsapp-bot/auth:/app/auth
    environment:
      - PORT=3000
      - HOOK_TOKEN=${HOOK_TOKEN}
      # Baileys is a plain Node process (~100MB). Restart if it ever drifts
      # well past that for 3 consecutive minutes. 0 disables.
      - MAX_MEM_MB=400
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>r.json()).then(j=>process.exit(j.whatsappReady?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - monitoring-network
    depends_on:
      - uptime-kuma
    logging: *default-logging

  whatsapp-ui:
    build:
      context: ./whatsapp-bot
      dockerfile: Dockerfile.ui
    container_name: whatsapp-ui
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./whatsapp-bot/config:/app/config
    environment:
      - UI_PORT=3002
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - monitoring-network
    logging: *default-logging

networks:
  monitoring-network:
    driver: bridge
