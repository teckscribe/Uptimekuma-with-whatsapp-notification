x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  uptime-kuma:
    # Pinned to the exact release that wrote the data in uptime-kuma-data/.
    # Do not bump this without a fresh backup: the SQLite schema migrates
    # forward on start and cannot be rolled back.
    #
    # If this tag ever disappears from Docker Hub, load the saved copy:
    #   ./scripts/load-image.sh    (reads images/uptime-kuma-2.0.2.tar.gz)
    image: ${UPTIME_KUMA_IMAGE:-louislam/uptime-kuma:2.0.2}
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma-data:/app/data
    environment:
      - UPTIME_KUMA_PORT=3001
    networks:
      - monitoring-network
    logging: *default-logging

  whatsapp-bot:
    build: ./whatsapp-bot
    container_name: whatsapp-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./whatsapp-bot/config:/app/config
      - ./whatsapp-bot/wwebjs_auth:/app/wwebjs_auth
    environment:
      - PORT=3000
      - HOOK_TOKEN=${HOOK_TOKEN}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - PROTOCOL_TIMEOUT_MS=300000
      # Restart when the container's total footprint stays above this for 3 minutes.
      # Measured steady state is ~750MB (mostly the Chromium renderer, which is
      # irreducible for whatsapp-web.js). 1200 catches genuine drift without
      # firing on normal fluctuation during initial sync. 0 disables.
      - MAX_MEM_MB=1200
      # V8 heap cap for the Chromium renderer. 0 = uncapped. Any cap risks
      # aborting the renderer during a fresh-link sync, which reloads the page
      # and restarts the sync in a loop. Steady-state memory is bounded by
      # MAX_MEM_MB instead.
      - RENDERER_HEAP_MB=0
    # Hard ceiling. Steady state is ~600-750MB and MAX_MEM_MB restarts the app
    # cleanly before this is reached. The gap above MAX_MEM_MB exists for the
    # initial sync after a fresh QR scan, which peaks past 1200MB and must not
    # be OOM-killed part-way through. This is a cap, not a reservation.
    mem_limit: 2g
    # Equal to mem_limit = no swap for this container.
    memswap_limit: 2g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>r.json()).then(j=>process.exit(j.whatsappReady?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - monitoring-network
    depends_on:
      - uptime-kuma
    logging: *default-logging

  whatsapp-ui:
    build:
      context: ./whatsapp-bot
      dockerfile: Dockerfile.ui
    container_name: whatsapp-ui
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./whatsapp-bot/config:/app/config
    environment:
      - UI_PORT=3002
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - monitoring-network
    logging: *default-logging

networks:
  monitoring-network:
    driver: bridge
