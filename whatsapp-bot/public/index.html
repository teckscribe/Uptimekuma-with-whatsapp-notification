<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Bot Configuration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #25D366;
      --primary-glow: rgba(37, 211, 102, 0.3);
      --bg-color: #0f172a;
      --surface: rgba(30, 41, 59, 0.7);
      --surface-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --input-bg: rgba(15, 23, 42, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 211, 102, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
    }

    .container {
      width: 100%;
      max-width: 950px;
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--surface-border);
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                  0 0 0 1px rgba(255,255,255,0.02) inset;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }

    .header-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #25D366, #128C7E);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 10px 25px var(--primary-glow);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: white;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 15px;
      margin-top: 4px;
      font-weight: 400;
    }

    .table-container {
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 12px;
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0 16px 8px 16px;
      text-align: left;
    }

    tr.data-row {
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.3s ease;
    }

    tr.data-row:hover {
      background: rgba(255, 255, 255, 0.05);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    td {
      padding: 12px 16px;
    }

    td:first-child {
      border-top-left-radius: 16px;
      border-bottom-left-radius: 16px;
    }

    td:last-child {
      border-top-right-radius: 16px;
      border-bottom-right-radius: 16px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      font-size: 14px;
      color: white;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: rgba(148, 163, 184, 0.5);
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(15, 23, 42, 0.8);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    input.locked {
      background: transparent;
      border-color: transparent;
      color: var(--text-main);
      cursor: default;
      font-weight: 500;
    }

    input.locked:focus {
      box-shadow: none;
      border-color: transparent;
    }

    .row-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-start;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-edit {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 8px 16px;
    }

    .btn-edit:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    
    .btn-edit.active {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }

    .btn-del {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      padding: 8px 16px;
    }

    .btn-del:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .top-actions {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--surface-border);
    }

    .btn-add {
      background: transparent;
      color: var(--text-main);
      border: 1px dashed rgba(255, 255, 255, 0.2);
    }

    .btn-add:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(37, 211, 102, 0.05);
    }

    .btn-save {
      background: linear-gradient(135deg, #25D366, #1EBE55);
      color: white;
      box-shadow: 0 10px 20px var(--primary-glow);
      padding: 12px 28px;
    }

    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(37, 211, 102, 0.4);
    }

    .btn-refresh {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      padding: 12px;
    }

    .btn-refresh:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .msg {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      display: none;
      z-index: 1000;
      animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(50px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .msg.success {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(6, 95, 70, 0.9);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .msg.error {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(153, 27, 27, 0.9);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    @media (max-width: 768px) {
      .container { padding: 30px 20px; }
      .top-actions { flex-direction: column; align-items: stretch; }
      .top-actions > div { display: none; }
      th { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr.data-row { margin-bottom: 16px; border-radius: 16px; padding: 10px; }
      td { padding: 8px; }
      td:first-child { padding-top: 16px; }
      td:last-child { padding-bottom: 16px; border-top: 1px solid var(--surface-border); margin-top: 8px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="header-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
      </div>
      <div>
        <h1>Notification Routing</h1>
        <div class="subtitle">Securely map your Uptime Kuma monitors to WhatsApp numbers</div>
      </div>
    </div>

    <div class="top-actions">
      <div style="flex-grow: 1;"></div>
      
      <button class="btn-refresh" onclick="loadData()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        Refresh
      </button>

      <button class="btn-add" onclick="addRow('', '', false)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add Monitor
      </button>
    </div>

    <div class="table-container">
      <table id="configTable">
        <thead>
          <tr>
            <th width="35%">Monitor Hostname</th>
            <th width="45%">Phone Numbers (comma separated)</th>
            <th width="20%">Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows injected via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <div id="msg" class="msg"></div>

  <script>
    async function loadData() {
      try {
        const res = await fetch('/api/hosts');
        const data = await res.json();
        
        const tbody = document.querySelector("#configTable tbody");
        tbody.innerHTML = "";
        
        const entries = Object.entries(data);
        
        // Sort alphabetically, keeping 'default' at the top
        entries.sort((a, b) => {
          if (a[0] === 'default') return -1;
          if (b[0] === 'default') return 1;
          return a[0].localeCompare(b[0], undefined, { sensitivity: 'base' });
        });
        
        entries.forEach(([host, numbers]) => {
          addRow(host, numbers.join(", "), true);
        });
      } catch (err) {
        showMessage("Failed to load data from server.", "error");
      }
    }

    function addRow(host = "", phones = "", isLocked = true) {
      const tbody = document.querySelector("#configTable tbody");
      const tr = document.createElement("tr");
      tr.className = "data-row";
      
      const lockClass = isLocked ? "locked" : "";
      const readOnlyAttr = isLocked ? "readonly" : "";
      
      // Default row protection
      const hostInput = host === "default" 
        ? `<input value="default" readonly class="locked" style="color: #94a3b8;" title="Fallback routing">`
        : `<input class="${lockClass}" ${readOnlyAttr} placeholder="e.g. My Website" value="${host}">`;
      
      const editBtn = host === "default"
        ? `<button class="btn-edit" onclick="toggleEdit(this, true)">Edit</button>`
        : `<button class="btn-edit ${isLocked ? '' : 'active'}" onclick="toggleEdit(this, false)">${isLocked ? 'Edit' : 'Save'}</button>`;
        
      const deleteBtn = host === "default"
        ? ``
        : `<button class="btn-del" onclick="if(confirm('Are you sure you want to remove this monitor?')) { this.closest('tr').remove(); saveData(); }">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
           </button>`;

      tr.innerHTML = `
        <td>${hostInput}</td>
        <td><input class="${lockClass}" ${readOnlyAttr} placeholder="919876543210, 918765432109" value="${phones}"></td>
        <td>
          <div class="row-actions">
            ${editBtn}
            ${deleteBtn}
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    }
    
    function toggleEdit(btn, isDefaultRow) {
      const tr = btn.closest("tr");
      const inputs = tr.querySelectorAll("input");
      
      const isCurrentlyLocked = inputs[1].classList.contains("locked");
      
      if (isCurrentlyLocked) {
        if (!isDefaultRow) {
          inputs[0].removeAttribute("readonly");
          inputs[0].classList.remove("locked");
        }
        inputs[1].removeAttribute("readonly");
        inputs[1].classList.remove("locked");
        
        btn.innerHTML = 'Save';
        btn.classList.add("active");
        inputs[1].focus();
      } else {
        if (!isDefaultRow) {
          inputs[0].setAttribute("readonly", true);
          inputs[0].classList.add("locked");
        }
        inputs[1].setAttribute("readonly", true);
        inputs[1].classList.add("locked");
        
        btn.innerHTML = 'Edit';
        btn.classList.remove("active");
        
        saveData();
      }
    }

    async function saveData() {
      const rows = document.querySelectorAll("#configTable tbody tr");
      const result = {};

      rows.forEach(row => {
        const host = row.children[0].children[0].value.trim();
        const phones = row.children[1].children[0].value
          .split(",")
          .map(v => v.trim())
          .filter(v => v);

        if (host) result[host] = phones;
      });

      try {
        const res = await fetch("/api/hosts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(result)
        });

        if (res.ok) {
          showMessage('<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> Settings saved successfully!', "success");
        } else {
          showMessage('<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg> Failed to save settings.', "error");
        }
      } catch (err) {
        showMessage('<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> Network error occurred.', "error");
      }
    }

    function showMessage(html, type) {
      const msg = document.getElementById("msg");
      msg.innerHTML = html;
      msg.className = `msg ${type}`;
      
      setTimeout(() => {
        msg.style.animation = 'slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) reverse forwards';
        setTimeout(() => {
          msg.style.display = 'none';
          msg.style.animation = '';
        }, 400);
      }, 3000);
    }

    document.addEventListener("DOMContentLoaded", loadData);
  </script>
</body>
</html>
